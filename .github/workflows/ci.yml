# CI runs lint + the fixture-based test suite.
#
# The full UCI dataset (~45 MB xlsx) is deliberately NOT downloaded in CI:
# tests run on tests/fixtures/sample.csv (1,950 real rows committed to the
# repo); the single full-dataset test skips itself when data/raw/ is absent.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff pytest
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (fixture-based, no dataset download)
        run: pytest -q
