<text x="74.0" y="34.0" font-size="18" fill="#0b0b0b" font-weight="700">Customer lifecycle - monthly growth accounting</text>
<text x="74.0" y="55.0" font-size="11" fill="#52514e">Identified customers (n=5,824); every buyer-month is new, retained (bought last month too) or resurrected (back after a gap).</text>
<text x="74.0" y="72.0" font-size="11" fill="#898781">Churned = bought last month, not this month. Quick ratio = (new + resurrected) / churned; >= 1 means the buyer base grew.</text>
