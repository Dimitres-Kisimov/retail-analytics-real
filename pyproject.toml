[project]
name = "retail-analytics-real"
version = "1.0.0"
description = "End-to-end analytics on the real UCI Online Retail II dataset: documented cleaning, honest EDA, from-scratch RFM segmentation and leakage-safe weekly revenue forecasting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Dimitres Kisimov" }]
keywords = ["analytics", "retail", "rfm", "forecasting", "data-cleaning", "uci"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["retail"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
